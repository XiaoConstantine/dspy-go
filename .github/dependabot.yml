version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/cmd/dspy-cli"
    schedule:
      interval: daily
    groups:
      shared-go-dependencies:
        group-by: dependency-name
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: daily

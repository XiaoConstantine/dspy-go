name: Unit and Integration Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  unit-tests:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            go.sum
            cmd/dspy-cli/go.sum

      - name: Download root dependencies
        run: go mod download

      - name: Download CLI dependencies
        working-directory: cmd/dspy-cli
        run: go mod download

      - name: Vet root module
        run: go vet ./...

      - name: Test root packages
        run: go test -tags skip -race -covermode atomic -v ./pkg/... -coverprofile ./coverage.txt

      - name: Vet CLI module
        working-directory: cmd/dspy-cli
        run: go vet ./...

      - name: Test CLI module
        working-directory: cmd/dspy-cli
        run: go test -race ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: pkg
